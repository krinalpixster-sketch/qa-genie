<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Genie - Confirm Delete</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <div class="logo">🤖 <strong>QA Genie</strong></div>
        <nav class="nav-links">
            <a href="/">🏠 Dashboard</a>
            <a href="/history">📋 History</a>
        </nav>
    </div>
</header>

<div class="container">

    <div class="delete-card card">
        <div class="delete-icon">⚠️</div>
        <h2>Delete Confirmation</h2>
        <p>Are you sure you want to delete this report permanently?</p>

        <div class="delete-details">
            <p><strong>Type:</strong> <span class="badge badge-{{ report.type|lower|replace(' ', '-') }}">{{ report.type }}</span></p>
            <p><strong>Feature:</strong> {{ report.feature }}</p>
            <p><strong>Description:</strong> {{ report.description }}</p>
        </div>

        <form action="/delete/{{ report.id }}" method="POST">
            <div class="action-buttons">
                <button type="submit" class="btn btn-danger">🗑️ Delete</button>
                <a href="/history" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
