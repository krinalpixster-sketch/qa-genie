<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Productivity Tool - Bug Report Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <div class="logo">🤖 <strong>QA Productivity Tool</strong></div>
        <nav class="nav-links">
            <a href="/">🏠 Dashboard</a>
            <a href="/history">📋 History</a>
        </nav>
    </div>
</header>

<div class="container">

    <div class="result-header">
        <span class="badge badge-large badge-bug-report">Bug Report</span>
        <h1>Defect Report: {{ feature }}</h1>
        <p class="subtitle">{{ description }}</p>
    </div>

    <div class="action-buttons">
        <form action="/regenerate" method="POST" style="display:inline;">
            <input type="hidden" name="report_id" value="{{ report_id }}">
            <input type="hidden" name="report_type" value="Bug Report">
            <input type="hidden" name="feature" value="{{ feature }}">
            <input type="hidden" name="description" value="{{ description }}">
            <input type="hidden" name="previous_content" value="{{ content }}">
            <button type="submit" class="btn btn-primary">🔄 Regenerate</button>
        </form>

        <form action="/download_pdf" method="POST" style="display:inline;">
            <input type="hidden" name="feature" value="{{ feature }}">
            <input type="hidden" name="description" value="{{ description }}">
            <input type="hidden" name="content" value="{{ content }}">
            <button type="submit" class="btn btn-primary">📄 Download PDF</button>
        </form>

        <form action="/download_excel" method="POST" style="display:inline;">
            <input type="hidden" name="feature" value="{{ feature }}">
            <input type="hidden" name="description" value="{{ description }}">
            <input type="hidden" name="content" value="{{ content }}">
            <button type="submit" class="btn btn-primary">📊 Download Excel</button>
        </form>

        <a href="/delete/{{ report_id }}" class="btn btn-danger">🗑️ Delete</a>
        <a href="/history" class="btn btn-secondary">📋 View in History</a>
        <a href="/bug" class="btn btn-secondary">🐛 Report Another Bug</a>
    </div>

    <div class="ai-result">
        {{ ai_response|safe }}
    </div>

</div>

</body>
</html>
